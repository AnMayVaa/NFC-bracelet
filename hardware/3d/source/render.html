<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fbf4e8;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'hero';
const W = +(q.get('w') || 1600), H = +(q.get('h') || 1000);
const uvOn = q.get('uv') === '1';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#fbf4e8');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const sun = new THREE.DirectionalLight('#fff3df', 2.4);
sun.position.set(-120, -160, 260);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 1, far: 800 });
sun.shadow.bias = -0.0004;
sun.shadow.radius = 6;
scene.add(sun);
scene.add(new THREE.HemisphereLight('#fff8ee', '#d9c7aa', 0.5));

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.receiveShadow = true;
scene.add(floor);

const mat = {
  basalt: new THREE.MeshStandardMaterial({ color: '#34363b', roughness: 0.92, metalness: 0.0 }),
  basaltBead: new THREE.MeshStandardMaterial({ color: '#2b2c30', roughness: 0.85 }),
  tangerine: new THREE.MeshStandardMaterial({ color: '#f28a22', roughness: 0.55 }),
  cream: new THREE.MeshStandardMaterial({ color: '#f4ead8', roughness: 0.6 }),
  pearl: new THREE.MeshPhysicalMaterial({ color: '#f6f1ea', roughness: 0.25, clearcoat: 0.6 }),
  uvOn: new THREE.MeshPhysicalMaterial({ color: '#f5761a', roughness: 0.3, clearcoat: 0.6 }),
  sea: new THREE.MeshStandardMaterial({ color: '#2f7fb5', roughness: 0.6 }),
  pcbGreen: new THREE.MeshStandardMaterial({ color: '#1f5e3a', roughness: 0.5 }),
  pcbBlue: new THREE.MeshStandardMaterial({ color: '#1f4fa8', roughness: 0.5 }),
  metal: new THREE.MeshStandardMaterial({ color: '#c9ccd1', roughness: 0.3, metalness: 0.9 }),
  black: new THREE.MeshStandardMaterial({ color: '#141414', roughness: 0.6 }),
  led: new THREE.MeshStandardMaterial({ color: '#7fe08a', emissive: '#3cff6a', emissiveIntensity: 1.2, roughness: 0.2 }),
  tag: new THREE.MeshStandardMaterial({ color: '#dcd6cc', roughness: 0.4 }),
};

const scene_json = await (await fetch('_render_parts/scene.json')).json();
const P = scene_json.params;
const loader = new STLLoader();
const geo = {};
for (const n of ['station_base', 'station_lid', 'admin_shell', 'admin_bottom_plate']) {
  const g = await loader.loadAsync('_render_parts/' + n + '.stl');
  g.computeVertexNormals();
  geo[n] = g;
}
function mesh(g, m) { const x = new THREE.Mesh(g, m); x.castShadow = true; x.receiveShadow = true; return x; }

// simple wristband prop (for scale only; the band itself is not part of these files)
function bandProp() {   // upright bracelet, charm face-down at the origin
  const grp = new THREE.Group();
  const R = 31, n = 16;
  for (let i = 1; i < n; i++) {
    const th = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const sp = mesh(new THREE.SphereGeometry(5, 32, 24), i === 2 ? mat.pearl : mat.basaltBead);
    sp.position.set(R * Math.cos(th), 0, R + R * Math.sin(th)); grp.add(sp);
  }
  const puck = mesh(new THREE.CylinderGeometry(17, 16, 7, 48), mat.basalt); puck.rotation.x = Math.PI / 2; puck.position.z = 10.5; grp.add(puck);
  const cap = mesh(new THREE.SphereGeometry(15, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), mat.tangerine);
  cap.rotation.x = -Math.PI / 2; cap.scale.set(1, 0.55, 1); cap.position.z = 7; grp.add(cap);
  return grp;
}

function esp32Model() {
  const [ex, ey] = P.esp32;
  const esp = new THREE.Group();
  const pcb = mesh(new RoundedBoxGeometry(ex, ey, 1.6, 2, 0.4), mat.pcbGreen); pcb.position.set(ex / 2, 0, 0.8); esp.add(pcb);
  const can = mesh(new RoundedBoxGeometry(18, 25.5, 3.2, 2, 0.3), mat.metal); can.position.set(ex - 10, 0, 3.2); esp.add(can);
  const usb = mesh(new RoundedBoxGeometry(5.6, 7.5, 2.8, 2, 0.4), mat.metal); usb.position.set(2.4, 0, 3.0); esp.add(usb);
  for (const s of [-1, 1]) for (let i = 0; i < 19; i++) {
    const pin = mesh(new THREE.BoxGeometry(0.64, 0.64, 8.5), mat.metal); pin.position.set(4.6 + i * 2.54, s * (ey / 2 - 1.3), -4.2); esp.add(pin);
    const hd = mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), mat.black); hd.position.set(4.6 + i * 2.54, s * (ey / 2 - 1.3), -1.3); esp.add(hd);
  }
  return esp;   // origin at the USB end, board along +x
}

const SL = P.adm_slope * Math.PI / 180, K = Math.tan(SL), Z0 = P.adm_front_h + K * P.adm_d / 2;
function onTop(obj, u, v, w = 0) {   // place a top-local object on the sloped admin top
  const g = new THREE.Group(); obj.position.add(new THREE.Vector3(u, v, w)); g.add(obj);
  g.rotation.x = SL; g.position.z = Z0; return g;
}
function admin(explode = 0, internals = false) {
  const grp = new THREE.Group();
  const plate = mesh(geo.admin_bottom_plate, mat.basalt); plate.position.z = P.adm_plate_t; grp.add(plate);
  const sh = mesh(geo.admin_shell, mat.tangerine); sh.position.z = P.adm_plate_t + explode; grp.add(sh);
  if (internals) {
    const esp = esp32Model(); esp.rotation.z = -Math.PI / 2;
    esp.position.set(P.adm_esp32_x, P.adm_d / 2 - P.wall - 0.6, P.adm_plate_t + P.esp32_lift);
    grp.add(esp);
    const top = new THREE.Group(); top.position.z = P.adm_plate_t + explode * 0.33; grp.add(top);
    const [pw, pd] = P.pn532;
    const pn = mesh(new RoundedBoxGeometry(pw, pd, 1.6, 2, 0.3), mat.pcbBlue);
    top.add(onTop(pn, P.adm_reader_u, P.adm_reader_v, -P.wall - 0.8));
    const bz = mesh(new THREE.CylinderGeometry(6, 6, 9.5, 48), mat.black); bz.rotation.x = Math.PI / 2;
    top.add(onTop(bz, 36, -22, -P.wall - 4.75));
    const led = mesh(new THREE.CylinderGeometry(2.5, 2.5, 7, 32), mat.led); led.rotation.x = Math.PI / 2;
    top.add(onTop(led, 36, 18, -2));
  }
  return grp;
}

function station(explode = 0, internals = false) {
  const grp = new THREE.Group();
  grp.add(mesh(geo.station_base, mat.basalt));
  const lid = mesh(geo.station_lid, mat.cream);
  lid.position.z = P.box_h + explode;
  grp.add(lid);
  if (internals) {
    const f = P.floor, lift = P.esp32_lift;
    const [ex, ey] = P.esp32;
    const x0 = -P.box_w / 2 + P.wall + 0.6;
    const esp = esp32Model();
    esp.position.set(x0, 0, f + lift + explode * 0.25);
    grp.add(esp);
    // RC522 under the lid
    const [rw, rd] = P.rc522;
    const rc = new THREE.Group();
    const b = mesh(new RoundedBoxGeometry(rw, rd, 1.6, 2, 0.3), mat.pcbBlue); rc.add(b);
    const ant = new THREE.Mesh(new THREE.TorusGeometry(14, 0.6, 8, 4, Math.PI * 2), mat.metal); ant.rotation.z = Math.PI / 4; ant.position.set(rw / 2 - 20, 0, 0.85); ant.scale.set(1.3, 1.3, 0.2); rc.add(ant);
    const chip = mesh(new THREE.BoxGeometry(5, 5, 1), mat.black); chip.position.set(-rw / 2 + 12, 0, -1.2); rc.add(chip);
    rc.position.set(P.reader_x, 0, P.box_h - 0.8 + explode * 0.72);
    grp.add(rc);
    const bz = mesh(new THREE.CylinderGeometry(6, 6, 9.5, 48), mat.black); bz.rotation.x = Math.PI / 2; bz.position.set(31, -20, P.box_h - 4.75 + explode * 0.62); grp.add(bz);
    const led = mesh(new THREE.CylinderGeometry(2.5, 2.5, 7, 32), mat.led); led.rotation.x = Math.PI / 2; led.position.set(31, 20, P.box_h - 1 + explode * 0.72); grp.add(led);
  }
  return grp;
}

const cam = new THREE.PerspectiveCamera(30, W / H, 1, 5000);
function look(pos, target) { cam.position.set(...pos); cam.lookAt(new THREE.Vector3(...target)); }

if (view === 'family') {
  const a = admin(); a.position.set(-75, 10, 0); a.rotation.z = 0.12; scene.add(a);
  const s = station(); s.position.set(85, -5, 0); s.rotation.z = -0.15; scene.add(s);
  look([230, -330, 230], [5, 0, 20]);
} else if (view === 'admin') {
  const a = admin(); a.rotation.z = 0.25; scene.add(a);
  look([150, -260, 190], [0, 0, 25]);
} else if (view === 'admin_exploded') {
  scene.add(admin(95, true));
  look([230, -300, 250], [0, 0, 62]);
} else if (view === 'station') {
  scene.add(station());
  look([150, -260, 190], [0, 0, 20]);
} else if (view === 'station_exploded') {
  scene.add(station(55, true));
  look([200, -260, 210], [-5, 0, 45]);
}
cam.updateProjectionMatrix();
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
